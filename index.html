<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Woordstad · 1500 Dutch words</title>
  <style id="app-style">:root {
  --ink:#243d34; --muted:#68776f; --green:#285b46; --lime:#dbe8a4;
  --paper:#f6f6ee; --white:#fffef9; --line:#dce3d5; --blue:#245caf; --red:#ad3c40;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.55 system-ui,sans-serif; }
button,input,textarea,select { font:inherit; color:inherit; }
button { cursor:pointer; }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:3px solid #d69b48; outline-offset:3px; }
header { padding:20px max(20px,5vw); background:var(--white); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand { display:flex; align-items:center; gap:10px; border:0; background:none; padding:0; text-align:left; }
.mark { display:grid; place-items:center; background:var(--green); color:var(--lime); width:42px; height:42px; border-radius:12px; font:700 27px Georgia,serif; }
.brand strong { display:block; font-size:20px; letter-spacing:-.7px; }
.brand small { display:block; font-size:10px; letter-spacing:1.4px; color:var(--muted); text-transform:uppercase; }
nav { max-width:1120px; margin:17px auto 0; padding:0 22px; display:flex; gap:5px; }
nav button { border:0; background:none; padding:9px 16px; border-radius:30px; font-weight:650; font-size:13px; color:var(--muted); }
nav .active { background:var(--green); color:white; }
main { max-width:1080px; margin:auto; padding:30px 24px 65px; }
h1,h2 { font-family:Georgia,serif; font-weight:500; line-height:1.15; letter-spacing:-1px; margin:0 0 14px; }
h1 { font-size:45px; } h2 { font-size:33px; } h3 { font-size:19px; margin:0 0 10px; }
p { margin:0 0 15px; }
.eyebrow { text-transform:uppercase; letter-spacing:1.8px; font-size:10px; font-weight:750; color:var(--green); margin-bottom:12px; }
.muted { color:var(--muted); } .small { font-size:12px; } .de { color:var(--blue); } .het { color:var(--red); }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .between { justify-content:space-between; }
.primary,.secondary,.quiet { display:inline-flex; justify-content:center; align-items:center; border-radius:9px; padding:11px 16px; font-size:13px; font-weight:650; }
.primary { background:var(--green); border:1px solid var(--green); color:white; }
.secondary { background:var(--white); border:1px solid var(--line); }
.quiet { background:none; border:0; color:var(--green); padding:8px 3px; }
.pill { padding:5px 10px; border-radius:20px; background:#eaf0dc; color:var(--green); font-size:11px; font-weight:650; }
.hero { display:grid; grid-template-columns:1.25fr 1fr; gap:30px; align-items:center; padding:5px 0 28px; }
.hero p { color:var(--muted); max-width:470px; }
.hero-art { background:#e6ecd7; border-radius:24px; overflow:hidden; }
.hero-art svg { display:block; width:100%; max-height:230px; }
.stats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:0 0 26px; }
.stat { background:var(--white); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.stat strong { display:block; font-size:23px; font-weight:600; } .stat span { font-size:11px; color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.topic,.panel,.word-card { border:1px solid var(--line); border-radius:16px; background:var(--white); padding:23px; }
.topic { display:flex; flex-direction:column; } .topic p { font-size:13px; color:var(--muted); flex:1; }
.topic .thumb { height:120px; margin:-12px -8px 12px; overflow:hidden; border-radius:10px; background:#f1f2e8; }
.topic svg { width:100%; height:100%; }
.topic .primary { width:100%; margin-top:12px; }
.note { padding:13px 16px; border-radius:10px; background:#eaf0de; color:#4a6453; font-size:12px; margin-top:20px; }
.notice { padding:12px 15px; border:1px solid var(--line); border-radius:10px; margin-bottom:20px; font-size:13px; }
.lesson { max-width:760px; margin:auto; }
.steps { display:flex; gap:7px; margin:18px 0 23px; } .steps i { height:5px; flex:1; background:#dce3d4; border-radius:4px; } .steps i.on { background:var(--green); }
.stage-content { display:grid; grid-template-columns:1fr 1.05fr; gap:27px; align-items:center; }
.cue { border:1px solid var(--line); border-radius:13px; background:#f2f3e8; overflow:hidden; }
.cue svg { display:block; width:100%; } .cue p { font-size:12px; text-align:center; padding:0 14px 13px; margin:0; color:var(--muted); }
.word { font:500 35px/1.2 Georgia,serif; margin:8px 0; }
.example { font-size:17px; margin:20px 0 5px; } .translation { font-size:12px; color:var(--muted); margin-bottom:18px; }
label.field { display:block; margin-bottom:7px; font-size:12px; font-weight:650; }
input[type=text],input[type=search],textarea,select { width:100%; border:1px solid #b9c5b1; background:white; border-radius:9px; padding:12px; }
.answer { font-size:21px; } textarea { min-height:140px; resize:vertical; line-height:1.7; }
.footer { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:23px; flex-wrap:wrap; }
.feedback { margin-top:18px; padding:14px 16px; border:1px solid #cfddba; background:#eef3e2; border-radius:10px; }
.feedback.bad { background:#fff2e5; border-color:#ead1b3; } .feedback p:last-child { margin-bottom:0; }
.audio { text-align:center; padding:12px 0 18px; }
.play { background:var(--green); color:white; border:0; width:70px; height:70px; border-radius:50%; font-size:25px; margin-bottom:12px; }
.source { font-size:11px; color:var(--muted); margin:7px 0; }
.options { display:grid; gap:9px; margin-top:18px; }
.option { padding:14px; border:1px solid var(--line); border-radius:10px; background:white; text-align:left; }
.option.correct { background:#e9f0d7; border-color:#86a268; } .option.wrong { background:#fcecdf; border-color:#c49067; }
.transcript { background:#f0f2e8; border-radius:10px; padding:15px; margin:13px 0; }
.tick { display:flex; align-items:flex-start; gap:9px; font-size:13px; margin:10px 0; } .tick input { margin-top:5px; accent-color:var(--green); }
.tokens { display:flex; flex-wrap:wrap; gap:6px; margin:13px 0; } .tokens span { background:#edf0df; border-radius:6px; padding:5px 8px; font-size:13px; }
.library-controls { display:grid; grid-template-columns:1fr 180px; gap:12px; margin:20px 0; }
.word-card { padding:18px; } .word-card .word { font-size:27px; } .word-card .cue { margin-bottom:15px; height:135px; } .word-card svg { height:100%; }
.word-card .example { font-size:14px; margin-top:14px; }
.review-list { display:grid; gap:9px; margin-top:18px; } .review-row { display:flex; gap:12px; justify-content:space-between; align-items:center; border:1px solid var(--line); border-radius:10px; padding:13px 16px; background:var(--white); }
.box { font-size:11px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; color:var(--muted); white-space:nowrap; }
.summary { max-width:660px; margin:25px auto; text-align:center; } .summary .panel { padding:40px 28px; }
dialog { width:min(94vw,690px); max-height:90vh; border:1px solid var(--line); border-radius:18px; padding:25px; color:var(--ink); background:var(--white); }
dialog::backdrop { background:#17372b99; } dialog h2 { font-size:29px; } dialog textarea { font:12px/1.5 ui-monospace,monospace; min-height:145px; }
.dialog-tabs { display:flex; gap:6px; margin:17px 0; } .dialog-tabs button { border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:white; font-size:12px; } .dialog-tabs button.active { background:var(--green); color:white; }
input[type=file] { max-width:100%; font-size:12px; } input[type=range] { width:100%; accent-color:var(--green); }
.error { color:#a1422d; font-size:13px; margin:12px 0; white-space:pre-wrap; }
.schema { font-size:11px; background:#edf0e3; padding:12px; border-radius:8px; overflow:auto; white-space:pre-wrap; }
.hidden { display:none!important; } .sr { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); }
#toast { display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); max-width:90vw; border-radius:10px; padding:12px 18px; background:#203e32; color:white; font-size:13px; z-index:5; }
@media(max-width:720px) {
  input,textarea,select { font-size:16px; }
  header { padding:15px 18px; } .brand small { display:none; } main { padding:25px 18px 45px; }
  h1 { font-size:37px; } h2 { font-size:29px; } nav { padding:0 14px; } nav button { padding:9px 12px; }
  .hero { grid-template-columns:1fr; gap:15px; } .hero-art { display:none; }
  .stats { grid-template-columns:repeat(3,1fr); gap:7px; } .stat { padding:11px; } .stat strong { font-size:21px; }
  .grid { grid-template-columns:1fr; } .topic .thumb { height:135px; } .topic { padding:20px; }
  .stage-content { grid-template-columns:1fr; gap:20px; } .stage-content .cue { max-width:320px; width:100%; margin:auto; }
  .panel { padding:21px; } .footer .primary { flex:1; } .library-controls { grid-template-columns:1fr; }
  .word-card .cue { height:155px; } .review-row { align-items:flex-start; } dialog { padding:21px; }
}
@media(prefers-reduced-motion:no-preference) { button { transition:filter .15s; } button:hover:not(:disabled) { filter:brightness(.96); } }

/* v2.1 writing and phone controls. */
button { min-height:44px; } .brand { min-height:42px; } .quiet { min-height:38px; }
.dialog-tabs { flex-wrap:wrap; }
.rubric-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0; }
.load-more { display:flex;justify-content:center;margin:22px 0; }
@media(max-width:720px) { .rubric-grid { grid-template-columns:1fr; } .dialog-tabs button { flex:1; } }
</style>
</head>

  <script type="application/json" id="starter-pack">{"schemaVersion":2,"packId":"woordstad-1500","title":"Everyday Dutch · 1500 A2 words","topics":[{"id":"pronouns","title":"Voornaamwoorden","english":"Pronouns & question words","description":"Pronouns, articles and question words."},{"id":"connections","title":"Verbindingswoorden","english":"Prepositions & connectors","description":"Prepositions, conjunctions and small words."},{"id":"essential-verbs","title":"Basiswerkwoorden","english":"Essential verbs","description":"The most important Dutch verbs to get started."},{"id":"daily-routines","title":"Dagelijkse routines","english":"Daily routines","description":"Actions you do every morning and evening."},{"id":"activities","title":"Activiteiten","english":"Movement & activities","description":"Moving around and doing things."},{"id":"communication","title":"Communiceren","english":"Communication","description":"Talking, writing, forms and digital actions."},{"id":"family","title":"Familie","english":"People & family","description":"Family members, relationships and social words."},{"id":"personal","title":"Persoonsgegevens","english":"Personal details","description":"Your name, address, nationality and identity."},{"id":"time","title":"Tijd en kalender","english":"Time & calendar","description":"Days, months, clock times and how often."},{"id":"numbers","title":"Getallen","english":"Numbers & amounts","description":"Counting, ordering and describing quantities."},{"id":"home","title":"Thuis","english":"Home & rooms","description":"Rooms, furniture and parts of the house."},{"id":"household","title":"Huishouden","english":"Household","description":"Kitchen items, cleaning tools and appliances."},{"id":"food","title":"Eten en drinken","english":"Food & drinks","description":"Basic food, drinks and cooking ingredients."},{"id":"meals","title":"Maaltijden","english":"Meals & taste","description":"Fruit, vegetables, meal words and flavours."},{"id":"shopping","title":"Winkelen","english":"Shopping","description":"Shops, prices, money and buying things."},{"id":"clothing","title":"Kleding","english":"Clothing","description":"Clothes, accessories and what you wear."},{"id":"body","title":"Het lichaam","english":"Body & care","description":"Body parts, hygiene and personal care."},{"id":"health","title":"Gezondheid","english":"Health","description":"Illness, doctors, medicine and appointments."},{"id":"transport","title":"Vervoer","english":"Transport","description":"Vehicles, travel and getting around."},{"id":"town","title":"In de stad","english":"Town & directions","description":"Buildings, streets and finding your way."},{"id":"work","title":"Werk","english":"Work & jobs","description":"Jobs, workplaces, pay and working life."},{"id":"school","title":"School","english":"School & language","description":"Lessons, exams, writing and language learning."},{"id":"government","title":"Overheid","english":"Government & civic life","description":"Forms, permits, benefits and civic integration."},{"id":"digital","title":"Digitaal","english":"Computers & media","description":"Devices, messages, internet and media."},{"id":"leisure","title":"Vrije tijd","english":"Leisure","description":"Hobbies, sport, events and free time."},{"id":"nature","title":"Natuur en weer","english":"Nature & weather","description":"Weather, seasons, animals and colours."},{"id":"descriptions","title":"Beschrijvingen","english":"Descriptions","description":"Adjectives and descriptive words."},{"id":"feelings","title":"Gevoelens","english":"Feelings & opinions","description":"Emotions, opinions and polite phrases."},{"id":"verbs","title":"Meer werkwoorden","english":"More verbs","description":"Extra useful verbs for everyday situations."},{"id":"answers","title":"Korte antwoorden","english":"Short answers & filler words","description":"Direction words, particles and short answer words."}],"listening":[{"id":"listen.bakery.roll-price","topic":"food","kind":"dialogue","skill":"detail","transcript":"Goedemorgen. Twee broodjes, alstublieft. Dat is drie euro twintig. Wilt u ook de bon? Ja, graag.","question":"How much do the two bread rolls cost together?","options":["€2.30","€3.20","€3.02"],"answer":1,"explanation":"The baker says ‘drie euro twintig’: three euros and twenty cents.","translation":"Good morning. Two bread rolls, please. That is three euros twenty. Would you also like the receipt? Yes, please."},{"id":"listen.bakery.opening-announcement","topic":"food","kind":"announcement","skill":"gist","transcript":"Beste klanten, de winkel sluit vandaag om vijf uur. Morgen zijn we vanaf acht uur weer open.","question":"What is the announcement about?","options":["A special offer on cheese","A lost bag","The shop's opening and closing times"],"answer":2,"explanation":"The announcement tells customers when the shop closes today and opens tomorrow.","translation":"Dear customers, the shop closes today at five o'clock. Tomorrow we are open again from eight o'clock."},{"id":"listen.bakery.collection-deadline","topic":"food","kind":"message","skill":"detail","transcript":"Hallo Sara, uw bestelling is klaar. U kunt de broodjes vandaag tot twaalf uur ophalen.","question":"What is the latest time Sara can collect the bread rolls today?","options":["Twelve o'clock","Ten o'clock","Two o'clock"],"answer":0,"explanation":"‘Tot twaalf uur’ means until twelve o'clock.","translation":"Hello Sara, your order is ready. You can collect the bread rolls today until twelve o'clock."},{"id":"listen.bakery.customer-order","topic":"food","kind":"dialogue","skill":"gist","transcript":"Wilt u koffie? Nee, dank u. Ik wil alleen een broodje kaas. Dat is goed.","question":"What does the customer want?","options":["Coffee and cake","Only a cheese roll","Only a coffee"],"answer":1,"explanation":"The customer refuses coffee and asks for only a cheese roll.","translation":"Would you like coffee? No, thank you. I only want a cheese roll. That is fine."},{"id":"listen.doctor.appointment-time","topic":"health","kind":"dialogue","skill":"detail","transcript":"Ik wil graag een afspraak maken. Kunt u morgen om half tien komen? Ja, dat kan. Tot morgen.","question":"What time is the appointment tomorrow?","options":["Ten thirty","Ten o'clock","Nine thirty"],"answer":2,"explanation":"Dutch ‘half tien’ means half an hour before ten: 9:30.","translation":"I would like to make an appointment. Can you come tomorrow at half past nine? Yes, I can. See you tomorrow."},{"id":"listen.doctor.waiting-announcement","topic":"health","kind":"announcement","skill":"gist","transcript":"De huisarts is nog bezig met een patiënt. U moet ongeveer twintig minuten wachten. Neem plaats in de wachtkamer.","question":"What should the patients do now?","options":["Sit in the waiting room","Go to the pharmacy","Come back tomorrow"],"answer":0,"explanation":"Patients are asked to take a seat in the waiting room because the doctor is still busy.","translation":"The GP is still with a patient. You have to wait about twenty minutes. Take a seat in the waiting room."},{"id":"listen.doctor.pharmacy-collection","topic":"health","kind":"message","skill":"detail","transcript":"Goedemiddag, dit is de apotheek. Uw medicijn is klaar. U kunt het vandaag vanaf drie uur ophalen.","question":"From what time can the medicine be collected today?","options":["One o'clock","Three o'clock","Five o'clock"],"answer":1,"explanation":"‘Vanaf drie uur’ means from three o'clock onwards.","translation":"Good afternoon, this is the pharmacy. Your medicine is ready. You can collect it today from three o'clock."},{"id":"listen.doctor.symptoms","topic":"health","kind":"dialogue","skill":"gist","transcript":"Waar heeft u last van? Ik heb hoofdpijn en koorts. Sinds wanneer? Sinds gisteren.","question":"What is the patient's problem?","options":["A lost medicine bottle","An appointment at the wrong time","A headache and a fever"],"answer":2,"explanation":"The patient says ‘hoofdpijn en koorts’: a headache and a fever.","translation":"What is troubling you? I have a headache and a fever. Since when? Since yesterday."},{"id":"listen.work.changed-meeting","topic":"work","kind":"message","skill":"detail","transcript":"Hoi Anna, de vergadering begint vandaag om elf uur, niet om tien uur. We spreken in de grote kamer.","question":"What is the new starting time of the meeting?","options":["Eleven o'clock","Ten o'clock","Twelve o'clock"],"answer":0,"explanation":"The speaker says the meeting starts at eleven, not ten.","translation":"Hi Anna, the meeting starts today at eleven o'clock, not ten o'clock. We will meet in the large room."},{"id":"listen.work.printer-announcement","topic":"work","kind":"announcement","skill":"gist","transcript":"Let op, de printer op de eerste verdieping is kapot. Gebruik vandaag de printer beneden.","question":"What is the announcement asking people to do?","options":["Repair a computer","Use a different printer","Leave the office early"],"answer":1,"explanation":"The upstairs printer is broken, so people should use the one downstairs.","translation":"Attention, the printer on the first floor is broken. Use the printer downstairs today."},{"id":"listen.work.break-time","topic":"work","kind":"dialogue","skill":"detail","transcript":"Zullen we nu pauze nemen? Nog even wachten. Ik ben over tien minuten klaar. Goed, dan halen we koffie.","question":"When will the colleagues take their break?","options":["In half an hour","Tomorrow morning","In ten minutes"],"answer":2,"explanation":"One colleague will finish in ten minutes; they agree to get coffee then.","translation":"Shall we take a break now? Wait a moment. I will be finished in ten minutes. All right, then we will get coffee."},{"id":"listen.work.sickness-message","topic":"work","kind":"message","skill":"gist","transcript":"Goedemorgen, met Sam. Ik ben ziek en kan vandaag niet werken. Morgen bel ik u weer.","question":"Why is Sam leaving this message?","options":["To report being ill and absent today","To ask about the salary","To invite a colleague for coffee"],"answer":0,"explanation":"Sam says he is ill and cannot work today.","translation":"Good morning, Sam speaking. I am ill and cannot work today. I will call you again tomorrow."},{"id":"listen.travel.platform-change","topic":"transport","kind":"announcement","skill":"detail","transcript":"Let op. De trein naar Utrecht vertrekt vandaag van spoor vier, niet van spoor twee. De vertrektijd blijft acht uur twintig.","question":"Which platform should passengers use today?","options":["Platform two","Platform four","Platform eight"],"answer":1,"explanation":"The platform changes to spoor vier. The departure time stays the same.","translation":"Attention. The train to Utrecht leaves from platform four today, not platform two. The departure time remains eight twenty."},{"id":"listen.travel.bus-replacement","topic":"transport","kind":"announcement","skill":"gist","transcript":"Door werkzaamheden rijden er vandaag geen treinen naar Leiden. U kunt de bus nemen. De bus stopt voor het station.","question":"What should travellers to Leiden do?","options":["Take a bus instead of the train","Buy a more expensive ticket","Wait inside the train"],"answer":0,"explanation":"There are no trains to Leiden today; travellers can take the bus.","translation":"Because of engineering works, no trains are running to Leiden today. You can take the bus. The bus stops in front of the station."},{"id":"listen.home.repair-time","topic":"home","kind":"message","skill":"detail","transcript":"Hallo, de monteur komt vrijdag tussen twee en vier uur om de verwarming te maken. Wilt u dan thuis zijn?","question":"When will the repair person arrive?","options":["Thursday between two and four","Friday at twelve","Friday between two and four"],"answer":2,"explanation":"Vrijdag tussen twee en vier uur means Friday between two and four.","translation":"Hello, the repair person will come on Friday between two and four to fix the heating. Could you be at home then?"},{"id":"listen.home.neighbour-key","topic":"home","kind":"dialogue","skill":"gist","transcript":"Ik kan mijn sleutel niet vinden. Kun je mij helpen zoeken? Natuurlijk. Heb je al op de keukentafel gekeken?","question":"What does the speaker need help with?","options":["Cooking a meal","Finding a key","Paying the rent"],"answer":1,"explanation":"The speaker cannot find the key and asks for help looking for it.","translation":"I cannot find my key. Can you help me look? Of course. Have you already looked on the kitchen table?"},{"id":"listen.shopping.exchange-day","topic":"shopping","kind":"dialogue","skill":"detail","transcript":"Deze broek is te klein. Kan ik hem ruilen? Ja, met de bon kan dat tot zaterdag.","question":"Until which day can the customer exchange the trousers?","options":["Friday","Sunday","Saturday"],"answer":2,"explanation":"Tot zaterdag means until Saturday. The receipt is needed.","translation":"These trousers are too small. Can I exchange them? Yes, with the receipt you can do that until Saturday."},{"id":"listen.shopping.card-only","topic":"shopping","kind":"announcement","skill":"gist","transcript":"Beste klanten, bij deze kassa kunt u alleen met uw pinpas betalen. Wilt u contant betalen? Ga dan naar kassa drie.","question":"Who should go to till three?","options":["Customers paying in cash","Customers buying shoes","Customers who have a receipt"],"answer":0,"explanation":"Customers wishing to pay contant, in cash, are directed to till three.","translation":"Dear customers, at this till you can only pay by debit card. Would you like to pay in cash? Then go to till three."}],"dictations":[{"id":"dictation.bakery.cheese-roll","topic":"food","text":"Ik wil een broodje kaas.","translation":"I would like a cheese roll."},{"id":"dictation.doctor.call-gp","topic":"health","text":"Ik bel de huisarts.","translation":"I call the GP."},{"id":"dictation.work.tomorrow-home","topic":"work","text":"Morgen werk ik thuis.","tra /* Audio is user initiated. Uploaded recordings are kept only for this session. */
function stopAudio() {
  try { speechSynthesis.cancel(); } catch {}
  if (activeAudio) { activeAudio.pause(); activeAudio = null; }
}
function refreshVoices() {
  try { voices = speechSynthesis.getVoices().filter(v => /^nl(?:[-_]|$)/i.test(v.lang)); }
  catch { voices = []; }
}
function audioMessage(text) { const el = $('audio-status'); if (el) el.textContent = text; }
function playText(text, finished = null) {
  refreshVoices(); stopAudio();
  if (!voices.length) { toast('No Dutch voice is available here. Attach a recording or use the text support.'); return; }
  try {
    const u = new SpeechSynthesisUtterance(text); utterance = u;
    u.voice = voices.find(v => v.voiceURI === prefs.voice) || voices[0]; u.lang = u.voice.lang; u.rate = prefs.rate;
    u.onstart = () => audioMessage('Playing synthetic Dutch audio…');
    u.onend = () => { audioMessage('Played. Replay whenever you like.'); if (finished) finished(); };
    u.onerror = e => { if (!['canceled','interrupted'].includes(e.error)) toast('Audio could not play. Try a recording or the text support.'); };
    speechSynthesis.speak(u);
  } catch { toast('Audio is unavailable here. Text support is available.'); }
}
function audioTask() {
  const c = current(), t = taskFor();
  return {id:c.id,text:c.type==='listening'?t.transcript:c.type==='dictation'?t.text:c.type==='listenStudy'?t.example:t.lemma,url:t.audioUrl};
}
function completedAudio() {
  if (!ui.run || ui.run.complete) return;
  currentState().heard = true; audioMessage('Played. Replay whenever you like.');
  document.querySelectorAll('[data-action="choose"]').forEach(el => { if (!currentState().graded) el.disabled = false; });
  if (current().type === 'listenStudy') {
    const nextButton=document.querySelector('[data-action="next"]'); if(nextButton) nextButton.disabled=false;
  }
}
function playExercise() {
  const task = audioTask(), run = ui.run, index = run.index;
  const done = () => { if (ui.run === run && run.index === index) completedAudio(); };
  const url = recordings.get(task.id)?.url || task.url;
  if (!url) { playText(task.text,done); return; }
  stopAudio();
  try {
    const audio = new Audio(url); activeAudio = audio; audio.playbackRate = prefs.rate;
    audio.onplaying = () => audioMessage('Playing your recording…'); audio.onended = done;
    audio.onerror = () => toast('This recording could not play. Try another file or use text support.');
    const promise = audio.play(); if (promise) promise.catch(() => toast('Recording could not start. Try pressing play again.'));
  } catch { toast('The recording could not play. Try text support.'); }
}
function audioControls() {
  const c = current(), task = audioTask(), uploaded = recordings.get(task.id);

  ${ui.pending?`<div class="feedback"><strong>Ready to ${ui.pending.restore?'restore this backup':'merge this content'}</strong><p class="small">${ui.pending.result.added} new · ${ui.pending.result.updated} updated · ${ui.pending.result.unchanged} unchanged. ${ui.pending.restore?'Newer matching practice records are kept.':ui.pending.result.resetSkills.length+' skills reset because their answers changed.'}</p>${ui.pending.warnings?.length?`<details open><summary class="small">${ui.pending.warnings.length} import notes</summary><ul class="small">${ui.pending.warnings.slice(0,8).map(w=>`<li>${html(typeof w==='string'?w:JSON.stringify(w))}</li>`).join('')}</ul></details>`:''}${button('Apply import','apply-import')}${button('Cancel','cancel-import','','quiet')}</div>`:''}
  ${ui.status?`<div class="note" role="status">${html(ui.status)}</div>`:''}
  ${ui.exportText?`<details open style="margin-top:15px"><summary class="small">Export text · copy if downloads are unavailable</summary><textarea readonly aria-label="Exported data" style="margin-top:8px">${html(ui.exportText)}</textarea></details>`:''}
  <details style="margin-top:18px"><summary class="small">Table help</summary><p class="small muted">Headings: word, meaning, example, translation, cue, keyword, topic, article, id. Only word and meaning are required. Without headings, use the first five columns in that order. Prefix nouns with de/het; use article - for phrases starting de/het. Existing words reuse their IDs.</p></details>
  <p class="source">${persistent?'Progress stays in this browser. Back up to move devices.':'Storage unavailable: export before leaving.'} Attached recordings last for this session.</p>`;
}
function offlineSettingsView() {
  return `<h3>A copy for your device</h3><p class="small muted">Download your vocabulary and progress as an HTML file. Open it in your browser for offline practice.</p>${button('Download offline copy','export-offline')}<div class="note">Words, pictures, and writing work offline. Voices and audio links may need internet. Attached recordings are excluded. Test in flight mode.</div>`;
}
function audioSettingsView() {
  return `<p class="small muted">Audio is synthetic by default. Attach a recording to any listening task, or import an HTTPS audioUrl.</p>
  <label class="field" for="voice-select">Dutch voice</label><select id="voice-select">${voices.length?voices.map(v=>`<option value="${html(v.voiceURI)}" ${prefs.voice===v.voiceURI?'selected':''}>${html(v.name)} · ${html(v.lang)}</option>`).join(''):'<option>No Dutch voice available here</option>'}</select>
  <label class="field" for="speech-rate" style="margin-top:18px">Speed <span id="rate-label">${prefs.rate.toFixed(2)}×</span></label><input id="speech-rate" type="range" min="0.65" max="1.1" step="0.05" value="${prefs.rate}">
  <div class="row" style="margin-top:18px">${button('▶ Test Dutch voice','test-audio')}${button('Refresh voices','refresh-voices','','quiet')}</div>
  <div class="note">${voices.length?'Replay and speed controls are always available.':'No Dutch voice? Attach audio or use text support. Supported practice earns no independent listening score.'}</div>`;
}
function boxesView() {
  return `<h3>One card, one skill.</h3><p class="small muted">Recall, spelling, articles, listening, and dictation each have their own review boxes.</p>
  <div class="review-list">${['10 minutes','1 day','3 days','7 days','14 days'].map((t,i)=>`<div class="review-row"><span>Box ${i+1}</span><strong>${t}</strong></div>`).join('')}</div>
  <div class="note">Correct when due: move up one box. Miss or hint: Box 1. Early success keeps the due date. Text-supported audio earns no independent score. Writing is self-assessed.</div>`;
}
function previewImport() {
  try {
    ui.error='';ui.status='';
    const text=ui.importText.trim(),isJSON=ui.importFormat==='json'||ui.importFormat==='auto'&&/^[{[]/.test(text);
    let incoming,restore=false,restored=null,warnings=[];
    if(isJSON){const raw=JSON.parse(text);restore=raw.type==='woordstad-backup';incoming=Engine.validatePack(restore?raw.pack:raw);if(restore)restored=validateProgress(raw.progress,Engine.mergePack(pack,incoming,progress).pack);}
    else {const parsed=Engine.parseTable(text,{existingPack:pack,delimiter:ui.delimiter});incoming=parsed.pack;warnings=parsed.warnings||[];}
    const result=Engine.mergePack(pack,incoming,progress);ui.pending={result,restore,restored,incoming,warnings};
  }catch(e){ui.pending=null;ui.error=e instanceof SyntaxError?'Invalid JSON. Check commas, quotes, and brackets.':e.message;}
  renderSettings();
}
function validateProgress(value, content) {
  if (!value||typeof value!=='object'||Array.isArray(value)) throw Error('Backup has no valid progress object.');
  const p=Engine.newProgress(), ids=new Set([...content.words,...content.listening,...content.dictations].map(x=>x.id));
  for (const [key,r] of Object.entries(value.records||{})) {
    if (!r||!ids.has(r.id)||!SKILLS[r.skill]||key!==r.id+'::'+r.skill||!Number.isFinite(r.due)||!Number.isInteger(r.box)||r.box<0||r.box>4||!Number.isFinite(r.last)||!Number.isInteger(r.tries)||r.tries<0||!Number.isInteger(r.successes)||r.successes<0) throw Error('Backup contains an invalid review record.');
    const compatible=['recall','article','spelling'].includes(r.skill)?content.words.some(w=>w.id===r.id&&(r.skill!=='article'||w.article)):r.skill==='listening'?content.listening.some(q=>q.id===r.id):content.dictations.some(q=>q.id===r.id);
    if(!compatible) throw Error('Backup contains a skill that does not match its word or exercise.');
    p.records[key]=r;
  }
  for (const key of ['seen','drafts','notes','completed']) for (const [id,v] of Object.entries(value[key]||{})) {
    if (['__proto__','constructor','prototype'].includes(id)) throw Error('Backup contains an invalid ID.');
    if (key==='seen'&&ids.has(id)&&v===true) p.seen[id]=true;
    else if (['drafts','notes'].includes(key)&&typeof v==='string'&&v.length<=30000) p[key][id]=v;
    else if (key==='completed'&&Number.isFinite(v)&&v>=0) p.completed[id]=v;
  }
  p.sentenceRecords={};
  for(const [id,r] of Object.entries(value.sentenceRecords||{})){
    if(!Writing.drills.some(d=>d.id===id)||!r||!Number.isInteger(r.tries)||r.tries<0||!Number.isInteger(r.successes)||r.successes<0||r.successes>r.tries||!Number.isFinite(r.last))throw Error('Backup contains invalid sentence practice.');
    p.sentenceRecords[id]=r;
  }
  return p;
}
function applyImport() {
  if (!ui.pending) return;
  const {restore,restored,incoming}=ui.pending;
  const result=Engine.mergePack(pack,incoming,progress);
  if (restore) {
    for (const [key,r] of Object.entries(restored.records)) {
      const old=result.progress.records[key]; if (!old||r.last>=(old.last||0)) result.progress.records[key]=r;
    }
    for (const key of ['seen','drafts','notes','completed']) result.progress[key]={...result.progress[key],...restored[key]};
    result.progress.sentenceRecords ||= {};
    for(const [id,r] of Object.entries(restored.sentenceRecords||{}))if(!result.progress.sentenceRecords[id]||r.last>=result.progress.sentenceRecords[id].last)result.progress.sentenceRecords[id]=r;
  }
  stopAudio(); pack=result.pack; progress=result.progress; progress.sentenceRecords ||= {}; ui.run=null; ui.pending=null; ui.error='';
  ui.status=`Imported successfully. ${pack.words.length} words are now available. Progress kept; changed answers reset only affected skills.`;
  ui.view='home'; save(); render(); renderSettings();
}
function exportJSON(backup) {
  const data=backup?{type:'woordstad-backup',schemaVersion:2,pack,progress,prefs}:pack;
  ui.exportText=JSON.stringify(data,null,2); renderSettings();
  try { const url=URL.createObjectURL(new Blob([ui.exportText],{type:'application/json'})),a=document.createElement('a'); a.href=url; a.download=backup?'woordstad-progress.json':'woordstad-content.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
  catch { toast('Use the export text below to copy your JSON.'); }
}

document.addEventListener('click', event => {
  const el=event.target.closest('[data-action]'); if(!el||el.disabled) return;
  const action=el.dataset.action;
  if(action==='submit-answer'||action==='check-sentence') return; // The form handles Enter and button submission once.
  event.preventDefault();
  switch(action) {
    case 'home': case 'reviews': case 'library': case 'sentences': navigate(action); break;
    case 'resume': navigate('lesson'); break;
    case 'end-session': ui.run=null; navigate('home'); break;
    case 'daily': startDaily(); break;
    case 'start-sentences': startSentences(); break;
    case 'sentence': startSentences(el.dataset.id); break;
    case 'reveal-sentence': checkSentence(true); break;
    case 'more-words': ui.limit+=24;filterWords();break;
    case 'export-offline': if(typeof exportOffline==='function')exportOffline();else toast('Offline export is unavailable in this preview.');break;
    case 'start': startLesson(el.dataset.topic); break;
    case 'next': next(); break;
    case 'start-review': startReview(); break;
    case 'extra-review': startReview(true); break;
    case 'drill': {
      const w=word(el.dataset.id); if(w) startReview(false,{id:w.id,topic:w.topic,skill:el.dataset.skill}); break;
    }
    case 'hint-cue': {
      const s=currentState(); s.answer=$('answer').value; s.hinted=true; s.showCue=true; render(); break;
    }
    case 'reveal': revealAnswer(); break;
    case 'show-answer': showAnswer(); break;
    case 'play-word': { const w=taskFor(); playText(noun(w)+'. '+w.example); break; }
    case 'play-exercise': playExercise(); break;
    case 'transcript': showTranscript(); break;
    case 'choose': answerChoice(Number(el.dataset.choice)); break;
    case 'attach-audio': $('recording-file').click(); break;
    case 'review-draft': reviewDraft(); break;
    case 'model': currentState().model=!currentState().model; render(); break;
    case 'play-model': playText(taskFor().model); break;
    case 'finish-writing':
      if(canFinishWriting()) { progress.completed[current().id]=(progress.completed[current().id]||0)+1; save(); next(); } break;
    case 'edit-cue': ui.editCue=el.dataset.id; filterWords(); break;
    case 'cancel-cue': ui.editCue=null; filterWords(); break;
    case 'save-cue': {
      const text=$('cue-edit').value.trim(); if(!text) { toast('Describe a little picture to remember.'); break; }
      progress.notes[el.dataset.id]=text; ui.editCue=null; save(); filterWords(); break;
    }
    case 'settings': openSettings(); break;
    case 'close-settings': $('settings').close(); break;
    case 'settings-tab': ui.tab=el.dataset.tab; renderSettings(); break;
    case 'export-pack': exportJSON(false); break;
    case 'export-backup': exportJSON(true); break;
    case 'check-import': ui.importText=$('import-text').value; previewImport(); break;
    case 'apply-import': applyImport(); break;
    case 'cancel-import': ui.pending=null; renderSettings(); break;
    case 'table-example':
      ui.importFormat='table';ui.importText='word\tmeaning\texample\ttranslation\tcue\nhet raam\twindow\tIk open het raam.\tI open the window.\t\nde sleutel\tkey\tWaar is mijn sleutel?\tWhere is my key?\t';ui.pending=null;ui.error='';ui.status='Example loaded. Cues can stay blank.';renderSettings();break;
    case 'example-import': {
      ui.importFormat='json';
      const t=pack.topics[0],w=pack.words.find(x=>x.topic===t.id);
      ui.importText=JSON.stringify({schemaVersion:2,packId:pack.packId,title:pack.title,topics:[t],words:[w],listening:[],dictations:[],writing:[]},null,2);
      ui.pending=null; ui.error=''; ui.status='Example loaded. Reimporting an unchanged item preserves every skill record.'; renderSettings(); break;
    }
    case 'test-audio': playText('Goedemorgen. Ik wil graag Nederlands leren.'); break;
    case 'refresh-voices': refreshVoices(); renderSettings(); break;
  }
});
document.addEventListener('submit',event=>{if(event.target.id==='answer-form'){event.preventDefault();submitAnswer();}else if(event.target.id==='sentence-form'){event.preventDefault();checkSentence();}});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.id==='word-search'){ui.search=el.value;ui.limit=24;filterWords();}
  else if(el.id==='answer'&&ui.run) currentState().answer=el.value;
  else if(el.id==='draft'&&ui.run){
    progress.drafts[current().id]=el.value; currentState().checked=false; currentState().checks=[]; save();
    $('writing-check').innerHTML='';
    $('draft-count').textContent=(el.value.trim()?el.value.trim().split(/\s+/).length:0)+' words · review your draft when ready';
    const finish=document.querySelector('[data-action="finish-writing"]'); if(finish)finish.disabled=true;
  } else if(el.id==='import-text'){
    ui.importText=el.value; ui.pending=null; ui.error='';
    const apply=$('settings').querySelector('[data-action="apply-import"]'); if(apply)apply.disabled=true;
  } else if(el.id==='speech-rate'){
    prefs.rate=Number(el.value); $('rate-label').textContent=prefs.rate.toFixed(2)+'×'; save();
  }
});
document.addEventListener('change',async event=>{
  const el=event.target;
  if(el.id==='topic-filter'){ui.topic=el.value;ui.limit=24;filterWords();}
  else if(el.id==='import-format'||el.id==='import-delimiter'){if(el.id==='import-format')ui.importFormat=el.value;else ui.delimiter=el.value;ui.pending=null;renderSettings();}
  else if(el.id==='review-filter'){ui.reviewSkill=el.value;render();}
  else if(el.id==='voice-select'){prefs.voice=el.value;save();}
  else if(el.dataset.check!==undefined&&ui.run){
    currentState().checks[Number(el.dataset.check)]=el.checked;
    const finish=document.querySelector('[data-action="finish-writing"]'); if(finish)finish.disabled=!canFinishWriting();
  } else if(el.id==='import-file'&&el.files?.[0]){
    const file=el.files[0];
    if(file.size>5*1024*1024){ui.error='Use a text or JSON file smaller than 5 MB.';renderSettings();return;}
    try{ui.importText=await file.text();ui.pending=null;previewImport();}catch{ui.error='This file could not be read.';renderSettings();}
  } else if(el.id==='recording-file'&&el.files?.[0]&&ui.run){
    const file=el.files[0];
    if(file.size>20*1024*1024||!(/^audio\//.test(file.type)||/\.(mp3|wav|m4a|ogg)$/i.test(file.name))){toast('Choose an audio file under 20 MB.');return;}
    const id=current().id,old=recordings.get(id);if(old)URL.revokeObjectURL(old.url);
    recordings.set(id,{url:URL.createObjectURL(file),name:file.name});
    currentState().heard=false;render();toast('Recording attached for this session. Press play to listen.');
  }
});
refreshVoices();
if('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged',()=>{
  refreshVoices();if($('settings').open&&ui.tab==='audio')renderSettings();
});
render();
setInterval(updateHeader,30000);

/* A standalone copy contains its vocabulary and progress; no service worker needed. */
function offlineHTML() {
  const copy = document.documentElement.cloneNode(true);
  copy.querySelector('#starter-pack').textContent = JSON.stringify(pack).replace(/</g,'\\u003c');
  let state = copy.querySelector('#embedded-state');
  if (!state) {
    state = document.createElement('script');
    state.id = 'embedded-state'; state.type = 'application/json';
    copy.querySelector('#app-code').before(state);
  }
  state.textContent = JSON.stringify({release:'3.0',pack,progress,prefs}).replace(/</g,'\\u003c');
  copy.querySelectorAll('script').forEach(s => {
    if (!['starter-pack','embedded-state','app-code'].includes(s.id)) s.remove();
  });
  copy.querySelector('#app').innerHTML = '<p>Opening your practice copy…</p>';
  const settings = copy.querySelector('#settings');
  settings.innerHTML = ''; settings.removeAttribute('open');
  const toast = copy.querySelector('#toast');
  toast.textContent = ''; toast.style.display = 'none';
  return '<!DOCTYPE html>\n' + copy.outerHTML;
}
function exportOffline() {
  try {
    const source = offlineHTML();
    const url = URL.createObjectURL(new Blob([source],{type:'text/html;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'woordstad-v2.1-offline.html'; a.click();
    setTimeout(() => URL.revokeObjectURL(url),1500);
    ui.exportText = source; ui.tab = 'data';
    ui.status = 'Standalone copy prepared. If the download did not start, copy the export text into an .html file. Open the file and test it in flight mode. Audio availability depends on your device.';
    renderSettings();
  } catch {
    toast('This preview cannot make a standalone copy here. Export a progress backup before leaving.');
  }
}
